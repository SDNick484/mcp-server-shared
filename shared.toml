# The files every sibling server carries a copy of, read by scripts/sync_shared.py.
#
# Each [[file]] copies `source` (a path in this repo) to `target` (a path in the
# sibling). `__PKG__` in a target becomes the sibling's package name (from its
# shared.lock). With `render = true`, `__PKG__` in the file's contents is
# replaced too; without it the file is copied byte for byte.
#
# `module` groups a shared module with its test. A sibling that doesn't use one
# lists it in its shared.lock (`exclude = ["remote"]`) and gets neither file.
# An entry without `module` goes to every sibling, with no way to opt out.
#
# To share another file: add it here, push to main, and run
# `python scripts/sync_shared.py --update` in each sibling. Dropping an entry
# doesn't delete the sibling's copy; delete those by hand.

format = 2  # bump only with a matching change to scripts/sync_shared.py (see FORMAT there)

[[file]]
source = "src/mcp_shared/remote.py"
module = "remote"
target = "src/__PKG__/remote.py"

[[file]]
source = "src/mcp_shared/logsafe.py"
module = "logsafe"
target = "src/__PKG__/logsafe.py"

[[file]]
source = "src/mcp_shared/tasks.py"
module = "tasks"
target = "src/__PKG__/tasks.py"

[[file]]
source = "src/mcp_shared/ratelimit.py"
module = "ratelimit"
target = "src/__PKG__/ratelimit.py"

[[file]]
source = "src/mcp_shared/registry.py"
module = "registry"
target = "src/__PKG__/registry.py"

[[file]]
source = "templates/tests/test_remote.py"
module = "remote"
target = "tests/test_remote.py"
render = true

[[file]]
source = "templates/tests/test_logsafe.py"
module = "logsafe"
target = "tests/test_logsafe.py"
render = true

[[file]]
source = "templates/tests/test_tasks.py"
module = "tasks"
target = "tests/test_tasks.py"
render = true

[[file]]
source = "templates/tests/test_ratelimit.py"
module = "ratelimit"
target = "tests/test_ratelimit.py"
render = true

[[file]]
source = "templates/tests/test_registry.py"
module = "registry"
target = "tests/test_registry.py"
render = true

# The sync script is shared too, so `--update` brings in a new version of itself.
[[file]]
source = "scripts/sync_shared.py"
target = "scripts/sync_shared.py"
