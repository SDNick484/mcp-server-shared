name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token gets nothing it doesn't need: this workflow only reads the checkout. A job that
# needs more (none today) asks for it in its own `permissions:`.
permissions:
  contents: read

# One run per branch: a push to a PR branch cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib in the sync script); 3.12 is what Alpine 3.20-3.22 ship in the
        # LXCs; 3.13 is Alpine edge and the desktop; 3.14 is ahead of the fleet, so a break there is
        # a heads-up rather than an outage.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions pinned to a commit, not a tag: a tag can be moved. The comment is the version the
      # SHA was taken from; Dependabot (.github/dependabot.yml) bumps both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The shared tests exactly as a sibling gets them, rendered for this repo's package.
      # --source .: from this checkout, so a PR tests its own changes, not main's.
      - name: Render the shared tests
        run: python scripts/sync_shared.py --source . --package mcp_shared
      - run: ruff check .
      - run: ruff format --check .
      # The rendered tests are gitignored here, and ruff skips gitignored files by default, so
      # `.` above never reaches them. Lint them explicitly: every sibling commits them and
      # lints them in its own CI, so a long line in a template fails all nine there.
      - run: ruff check --no-respect-gitignore tests
      - run: ruff format --check --no-respect-gitignore tests
      - run: mypy
      - run: pytest --cov --cov-report=term-missing
