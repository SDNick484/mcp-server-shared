format = 2

# The shared modules: byte-for-byte copies across all siblings.
# No templating, no string replacement: the source bytes are the destination bytes.
# Sibling packages are passed via --package; target paths use __PKG__ which is replaced
# by the package name (e.g. batocera_mcp, harmony_mcp).

[[file]]
source = "src/mcp_shared/remote.py"
module = "remote"
target = "src/__PKG__/remote.py"

[[file]]
source = "src/mcp_shared/logsafe.py"
module = "logsafe"
target = "src/__PKG__/logsafe.py"

[[file]]
source = "src/mcp_shared/tasks.py"
module = "tasks"
target = "src/__PKG__/tasks.py"

[[file]]
source = "src/mcp_shared/ratelimit.py"
module = "ratelimit"
target = "src/__PKG__/ratelimit.py"

[[file]]
source = "src/mcp_shared/registry.py"
module = "registry"
target = "src/__PKG__/registry.py"

[[file]]
source = "src/mcp_shared/lookup.py"
module = "lookup"
target = "src/__PKG__/lookup.py"

[[file]]
source = "src/mcp_shared/tools.py"
module = "tools"
target = "src/__PKG__/tools.py"

[[file]]
source = "templates/tests/test_remote.py"
module = "remote"
target = "tests/test_remote.py"
render = true

[[file]]
source = "templates/tests/test_logsafe.py"
module = "logsafe"
target = "tests/test_logsafe.py"
render = true

[[file]]
source = "templates/tests/test_tasks.py"
module = "tasks"
target = "tests/test_tasks.py"
render = true

[[file]]
source = "templates/tests/test_ratelimit.py"
module = "ratelimit"
target = "tests/test_ratelimit.py"
render = true

[[file]]
source = "templates/tests/test_registry.py"
module = "registry"
target = "tests/test_registry.py"
render = true

[[file]]
source = "templates/tests/test_lookup.py"
module = "lookup"
target = "tests/test_lookup.py"
render = true

[[file]]
source = "templates/tests/test_tools.py"
module = "tools"
# Target is test_tool_annotations.py because siblings already have tests/test_tools.py for their MCP tools
target = "tests/test_tool_annotations.py"
render = true

# The sync script is shared too, so `--update` brings in a new version of itself.
[[file]]
source = "scripts/sync_shared.py"
target = "scripts/sync_shared.py"
