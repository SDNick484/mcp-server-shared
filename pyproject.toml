[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-shared"
version = "0.1.0"
description = "The code the sibling MCP servers share (remote.py, logsafe.py, tasks.py), its tests, and the script that syncs them"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
# What the shared modules need. Each sibling already depends on these; keep the
# bounds in step with the siblings' own pyproject.toml.
dependencies = [
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-shared"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_shared"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# The templates hold __PKG__, which isn't a real module (isort can't place it).
# They're linted as rendered, in tests/, which is what every sibling runs.
extend-exclude = ["templates"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify (same as the siblings)
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "scripts"]
strict = true
